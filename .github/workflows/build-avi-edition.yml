name: Build and Deploy Avi Edition

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Extract n-gon source
        run: |
          rm -rf avi-edition/game
          mkdir -p avi-edition/game
          unzip -q n-gon-master.zip -d /tmp/n-gon-source
          root="$(find /tmp/n-gon-source -mindepth 1 -maxdepth 1 -type d | head -n 1)"
          if [ -z "$root" ]; then root=/tmp/n-gon-source; fi
          cp -a "$root"/. avi-edition/game/

      - name: Install Avi Edition
        run: |
          cp js/avi-edition.js avi-edition/game/js/avi-edition.js
          python3 - <<'PY'
          from pathlib import Path
          p = Path('avi-edition/game/index.html')
          if not p.exists():
              raise SystemExit('Could not find game/index.html after extracting n-gon-master.zip')
          s = p.read_text(encoding='utf-8')
          tag = '<script src="js/avi-edition.js"></script>'
          if tag not in s:
              marker = '</body>'
              if marker not in s:
                  raise SystemExit('game/index.html has no </body> marker for Avi Edition injection')
              s = s.replace(marker, f'    {tag}\n{marker}', 1)
          if '<meta name="avi-edition" content="true">' not in s:
              s = s.replace('<head>', '<head>\n    <meta name="avi-edition" content="true">\n    <meta name="description" content="Avi Edition interactive physics lab">', 1)
          p.write_text(s, encoding='utf-8')
          PY

      - name: Add Pages fallback
        run: |
          cat > 404.html <<'EOF'
          <!doctype html>
          <html lang="en">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width,initial-scale=1">
            <title>Physics Learning Center</title>
            <meta http-equiv="refresh" content="0; url=./">
          </head>
          <body></body>
          </html>
          EOF

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: .

      - name: Commit generated playable build
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add avi-edition 404.html
          if git diff --cached --quiet; then
            echo "No generated changes to commit."
          else
            git commit -m "Build playable Avi Edition site"
            git push
          fi

  deploy:
    needs: build
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
