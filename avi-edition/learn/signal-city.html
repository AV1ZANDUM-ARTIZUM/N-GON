<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Signal City</title><style>body{margin:0;background:#f3f0e8;color:#20252d;font-family:system-ui;text-align:center}header{padding:20px}canvas{display:block;margin:auto;max-width:96vw;background:#fff;border:1px solid #ccd0d6;border-radius:12px}button,input{font:inherit;margin:5px}button{padding:9px 14px;border:0;border-radius:8px;background:#20252d;color:#fff;font-weight:800;cursor:pointer}label{display:inline-block}.hint{max-width:800px;margin:auto;color:#606976}a{color:#274d75}</style></head><body><header><h1>🧠 Signal City</h1><p class="hint">An explorable crowd experiment: each person copies a signal from nearby people, but you control how strongly they conform.</p><label>Conformity <input id="rate" type="range" min="0" max="100" value="35"> <span id="rv">35%</span></label><button onclick="seed()">NEW CITY</button><button onclick="pulse()">SEND SIGNAL</button><div id="stats"></div></header><canvas id="c" width="900" height="560"></canvas><p><a href="./arcade.html">← Arcade</a></p><script>const c=document.querySelector('#c'),ctx=c.getContext('2d'),rate=document.querySelector('#rate'),rv=document.querySelector('#rv'),stats=document.querySelector('#stats');let people=[];rate.oninput=()=>rv.textContent=rate.value+'%';function seed(){people=[];for(let i=0;i<90;i++)people.push({x:30+Math.random()*840,y:30+Math.random()*500,vx:(Math.random()-.5)*.5,vy:(Math.random()-.5)*.5,s:Math.random()<.5?0:1});}function pulse(){let q=people[Math.floor(Math.random()*people.length)];q.s=1-q.s}function loop(){ctx.clearRect(0,0,900,560);let one=0;for(const p of people){let best=null,bd=Infinity;for(const q of people){if(q===p)continue;let d=(q.x-p.x)**2+(q.y-p.y)**2;if(d<bd&&d<10000){bd=d;best=q}}if(best&&Math.random()<+rate.value/100*.035)p.s=best.s;p.x+=p.vx;p.y+=p.vy;if(p.x<15||p.x>885)p.vx*=-1;if(p.y<15||p.y>545)p.vy*=-1;if(p.s)one++;ctx.beginPath();ctx.arc(p.x,p.y,7,0,7);ctx.fillStyle=p.s?'#ff6b5f':'#4779c9';ctx.fill()}let pct=Math.round(one/people.length*100);stats.textContent='Signal A: '+pct+'%  ·  Signal B: '+(100-pct)+'%';requestAnimationFrame(loop)}seed();loop()</script></body></html>
