<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Spring Lab</title><style>body{font-family:system-ui;max-width:720px;margin:auto;padding:30px;background:#f4f7fa;color:#172033}.box{background:white;padding:25px;border-radius:15px;border:1px solid #dce4eb}input{padding:10px;width:100%;margin:6px 0 15px;box-sizing:border-box}button{padding:11px 18px;background:#173b5d;color:white;border:0;border-radius:8px;font-weight:bold}.result{margin-top:18px;font-size:1.15rem}</style></head><body><div class="box"><h1>Spring Lab</h1><p>Use Hooke's law: F = kx.</p><label>Spring constant k (N/m)</label><input id="k" type="number" step="any"><label>Displacement x (m)</label><input id="x" type="number" step="any"><button onclick="calc()">Calculate</button><div class="result" id="r"></div></div><script>function calc(){let k=+document.getElementById('k').value,x=+document.getElementById('x').value;document.getElementById('r').textContent='Spring force magnitude = '+Math.abs(k*x).toFixed(2)+' N'}</script></body></html>
