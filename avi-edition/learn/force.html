<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Force Lab</title><style>body{font-family:system-ui,sans-serif;background:#f4f7fa;color:#172033;margin:0;padding:40px}main{max-width:760px;margin:auto;background:white;padding:30px;border-radius:16px;border:1px solid #dfe5ec}button{padding:12px 18px;border:0;border-radius:8px;background:#173b5d;color:white;font-weight:700;cursor:pointer}input{margin:8px;padding:8px}#result{font-size:1.4rem;margin-top:20px}</style></head><body><main><h1>Force Lab</h1><p>Use Newton's second law: <strong>a = F ÷ m</strong>.</p><label>Force (N)<input id="f" type="number" value="10"></label><label>Mass (kg)<input id="m" type="number" value="2" min="0.01"></label><button onclick="calc()">Calculate acceleration</button><div id="result"></div><p><a href="../../">Back to Learning Center</a></p></main><script>function calc(){const f=Number(document.getElementById('f').value),m=Number(document.getElementById('m').value);document.getElementById('result').textContent=m>0?`Acceleration: ${(f/m).toFixed(2)} m/s².`:'Mass must be greater than zero.'}</script></body></html>
