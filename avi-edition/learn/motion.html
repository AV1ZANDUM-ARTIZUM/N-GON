<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Motion Lab</title><style>body{font-family:system-ui;max-width:720px;margin:auto;padding:30px;background:#f4f7fa;color:#172033}.box{background:white;padding:25px;border-radius:15px;border:1px solid #dce4eb}input{padding:10px;width:100%;margin:6px 0 15px;box-sizing:border-box}button{padding:11px 18px;background:#173b5d;color:white;border:0;border-radius:8px;font-weight:bold}.result{margin-top:18px;font-size:1.15rem}</style></head><body><div class="box"><h1>Motion Lab</h1><p>Calculate average velocity from distance and time.</p><label>Distance (m)</label><input id="d" type="number" step="any"><label>Time (s)</label><input id="t" type="number" step="any"><button onclick="calc()">Calculate</button><div class="result" id="r"></div></div><script>function calc(){let d=+document.getElementById('d').value,t=+document.getElementById('t').value;document.getElementById('r').textContent=t>0?'Average velocity = '+(d/t).toFixed(2)+' m/s':'Enter a time greater than 0.'}</script></body></html>
