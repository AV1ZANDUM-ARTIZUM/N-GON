<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Circuit Lab</title><style>body{font-family:system-ui;max-width:720px;margin:auto;padding:30px;background:#f4f7fa;color:#172033}.box{background:white;padding:25px;border-radius:15px;border:1px solid #dce4eb}input{padding:10px;width:100%;margin:6px 0 15px;box-sizing:border-box}button{padding:11px 18px;background:#173b5d;color:white;border:0;border-radius:8px;font-weight:bold}.result{margin-top:18px;font-size:1.15rem}</style></head><body><div class="box"><h1>Circuit Lab</h1><p>Use Ohm's law: V = IR. Enter voltage and resistance to calculate current.</p><label>Voltage (V)</label><input id="v" type="number" step="any"><label>Resistance (Ω)</label><input id="r0" type="number" step="any"><button onclick="calc()">Calculate</button><div class="result" id="r"></div></div><script>function calc(){let v=+document.getElementById('v').value,r=+document.getElementById('r0').value;document.getElementById('r').textContent=r>0?'Current = '+(v/r).toFixed(3)+' A':'Enter a resistance greater than 0.'}</script></body></html>
