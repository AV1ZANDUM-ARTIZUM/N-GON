<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Projectile Lab</title><style>body{font-family:system-ui;max-width:720px;margin:auto;padding:30px;background:#f4f7fa;color:#172033}.box{background:white;padding:25px;border-radius:15px;border:1px solid #dce4eb}input{padding:10px;width:100%;margin:6px 0 15px;box-sizing:border-box}button{padding:11px 18px;background:#173b5d;color:white;border:0;border-radius:8px;font-weight:bold}.result{margin-top:18px;font-size:1.1rem}</style></head><body><div class="box"><h1>Projectile Lab</h1><p>Idealized level-ground projectile model, ignoring air resistance.</p><label>Launch speed (m/s)</label><input id="v" type="number" step="any"><label>Launch angle (degrees)</label><input id="a" type="number" step="any"><button onclick="calc()">Run Model</button><div class="result" id="r"></div></div><script>function calc(){let v=+document.getElementById('v').value,a=+document.getElementById('a').value*Math.PI/180,g=9.8;let time=2*v*Math.sin(a)/g,range=v*v*Math.sin(2*a)/g;document.getElementById('r').innerHTML='Flight time ≈ '+time.toFixed(2)+' s<br>Range ≈ '+range.toFixed(2)+' m'}</script></body></html>
