<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gravity Golf</title><style>body{margin:0;background:#0b1020;color:#fff;font-family:system-ui;text-align:center}header{padding:14px}canvas{display:block;margin:auto;max-width:96vw;border:2px solid #32446d;border-radius:12px;background:#101a30}button,input{font:inherit;margin:5px;padding:9px 12px;border-radius:8px;border:0}button{background:#62d6ff;font-weight:800;cursor:pointer}.hint{color:#aebbd0}a{color:#9bdfff}</style></head><body><header><h1>🏌️ Gravity Golf</h1><div>Angle <input id="angle" type="range" min="10" max="80" value="45"> <span id="av">45°</span> &nbsp; Power <input id="power" type="range" min="10" max="100" value="65"> <span id="pv">65</span></div><button id="shoot">SHOOT</button><button id="reset">RESET</button><span id="score"> Shots: 0</span><p class="hint">Get the ball into the glowing portal. Walls bounce. Gravity is your friend... sometimes.</p></header><canvas id="c" width="900" height="560"></canvas><p><a href="./arcade.html">← Arcade</a></p><script>const c=document.querySelector('#c'),x=c.getContext('2d'),A=document.querySelector('#angle'),P=document.querySelector('#power'),av=document.querySelector('#av'),pv=document.querySelector('#pv'),score=document.querySelector('#score');let ball,shots=0,done=false;const walls=[{x:220,y:100,w:30,h:320},{x:520,y:0,w:30,h:260},{x:690,y:300,w:30,h:260},{x:350,y:440,w:220,h:25}];const hole={x:820,y:105,r:25};function reset(){ball={x:75,y:500,vx:0,vy:0,r:12,live:false};shots=0;done=false;score.textContent=' Shots: 0'}function shoot(){if(ball.live||done)return;let a=+A.value*Math.PI/180,s=+P.value*.11;ball.vx=Math.cos(a)*s;ball.vy=-Math.sin(a)*s;ball.live=true;shots++;score.textContent=' Shots: '+shots}A.oninput=()=>av.textContent=A.value+'°';P.oninput=()=>pv.textContent=P.value;document.querySelector('#shoot').onclick=shoot;document.querySelector('#reset').onclick=reset;function hitRect(w){return ball.x+ball.r>w.x&&ball.x-ball.r<w.x+w.w&&ball.y+ball.r>w.y&&ball.y-ball.r<w.y+w.h}function frame(){x.clearRect(0,0,c.width,c.height);x.fillStyle='#162443';x.fillRect(0,0,c.width,c.height);x.strokeStyle='#2c3d63';for(let i=0;i<900;i+=45){x.beginPath();x.moveTo(i,0);x.lineTo(i,560);x.stroke()}for(let i=0;i<560;i+=45){x.beginPath();x.moveTo(0,i);x.lineTo(900,i);x.stroke()}x.fillStyle='#4b5d83';walls.forEach(w=>x.fillRect(w.x,w.y,w.w,w.h));x.beginPath();x.arc(hole.x,hole.y,hole.r,0,7);x.fillStyle='#8b7cff';x.shadowBlur=25;x.shadowColor='#8b7cff';x.fill();x.shadowBlur=0;x.beginPath();x.arc(hole.x,hole.y,10,0,7);x.fillStyle='#080c18';x.fill();x.beginPath();x.arc(ball.x,ball.y,ball.r,0,7);x.fillStyle='#62d6ff';x.shadowBlur=18;x.shadowColor='#62d6ff';x.fill();x.shadowBlur=0;if(ball.live){ball.vy+=.12;ball.x+=ball.vx;ball.y+=ball.vy;ball.vx*=.998;ball.vy*=.998;if(ball.x<ball.r||ball.x>c.width-ball.r){ball.vx*=-.82;ball.x=Math.max(ball.r,Math.min(c.width-ball.r,ball.x))}if(ball.y<ball.r||ball.y>c.height-ball.r){ball.vy*=-.82;ball.y=Math.max(ball.r,Math.min(c.height-ball.r,ball.y))}for(const w of walls)if(hitRect(w)){if(ball.x<w.x||ball.x>w.x+w.w)ball.vx*=-.82;else ball.vy*=-.82;ball.x+=ball.vx;ball.y+=ball.vy}let d=Math.hypot(ball.x-hole.x,ball.y-hole.y);if(d<hole.r){done=true;ball.live=false;setTimeout(()=>alert('HOLE! '+shots+' shot'+(shots==1?'':'s')+' — press RESET to play again.'),30)}}requestAnimationFrame(frame)}reset();frame()</script></body></html>
