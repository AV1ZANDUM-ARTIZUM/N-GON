<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Orbit Rescue</title><style>body{margin:0;background:#050814;color:#eef;font-family:system-ui;text-align:center}header{padding:12px}canvas{display:block;margin:auto;max-width:96vw;border:2px solid #26365d;border-radius:12px}button{padding:9px 14px;margin:4px;border:0;border-radius:8px;background:#62d6ff;font-weight:800}a{color:#9bdfff}.hint{color:#aab5ce}</style></head><body><header><h1>🚀 Orbit Rescue</h1><div>WASD / Arrow keys = thrust & turn · R = reset · collect all beacons</div><button onclick="reset()">RESET</button><span id="hud"></span><p class="hint">Gravity pulls you toward the planets. Use slingshots instead of fighting the universe.</p></header><canvas id="c" width="900" height="560"></canvas><p><a href="./arcade.html">← Arcade</a></p><script>const c=document.querySelector('#c'),ctx=c.getContext('2d'),keys={};let ship,beacons,won=false;const planets=[{x:300,y:280,r:48,m:1800},{x:650,y:180,r:34,m:1100},{x:700,y:430,r:55,m:2400}];addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=1;if(e.key.toLowerCase()==='r')reset()});addEventListener('keyup',e=>keys[e.key.toLowerCase()]=0);function reset(){ship={x:90,y:470,vx:1,vy:-1,a:-.7};beacons=[{x:480,y:110,got:0},{x:810,y:300,got:0},{x:430,y:480,got:0}];won=false}function loop(){ctx.fillStyle='#050814';ctx.fillRect(0,0,900,560);for(let i=0;i<80;i++){ctx.fillStyle='#ffffff55';ctx.fillRect((i*137)%900,(i*83)%560,2,2)}for(const p of planets){ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,7);ctx.fillStyle='#334a83';ctx.fill();ctx.beginPath();ctx.arc(p.x,p.y,p.r+8,0,7);ctx.strokeStyle='#334a8344';ctx.stroke()}for(const b of beacons)if(!b.got){ctx.beginPath();ctx.arc(b.x,b.y,11,0,7);ctx.fillStyle='#62d6ff';ctx.shadowBlur=20;ctx.shadowColor='#62d6ff';ctx.fill();ctx.shadowBlur=0;ctx.fillStyle='#fff';ctx.fillRect(b.x-2,b.y-15,4,30)}let ax=0,ay=0;if(keys['w']||keys['arrowup']){ax+=Math.cos(ship.a)*.075;ay+=Math.sin(ship.a)*.075}if(keys['s']||keys['arrowdown']){ax-=Math.cos(ship.a)*.035;ay-=Math.sin(ship.a)*.035}if(keys['a']||keys['arrowleft'])ship.a-=.055;if(keys['d']||keys['arrowright'])ship.a+=.055;for(const p of planets){let dx=p.x-ship.x,dy=p.y-ship.y,d2=dx*dx+dy*dy,d=Math.sqrt(d2);let g=p.m/Math.max(d2,900);ax+=dx/d*g;ay+=dy/d*g;if(d<p.r+8){reset();break}}ship.vx=(ship.vx+ax)*.998;ship.vy=(ship.vy+ay)*.998;ship.x+=ship.vx;ship.y+=ship.vy;if(ship.x<5||ship.x>895||ship.y<5||ship.y>555){reset()}for(const b of beacons)if(!b.got&&Math.hypot(ship.x-b.x,ship.y-b.y)<24)b.got=1;let left=beacons.filter(b=>!b.got).length;document.querySelector('#hud').textContent='  Beacons left: '+left;if(!left&&!won){won=true;setTimeout(()=>alert('RESCUE COMPLETE! You mastered orbital motion.'),20)}ctx.save();ctx.translate(ship.x,ship.y);ctx.rotate(ship.a);ctx.beginPath();ctx.moveTo(18,0);ctx.lineTo(-13,-9);ctx.lineTo(-8,0);ctx.lineTo(-13,9);ctx.closePath();ctx.fillStyle='#ffdc67';ctx.fill();ctx.fillStyle='#62d6ff';ctx.fillRect(-12,-4,7,8);ctx.restore();requestAnimationFrame(loop)}reset();loop()</script></body></html>
