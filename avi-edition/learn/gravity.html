<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gravity Lab</title><style>body{font-family:system-ui,sans-serif;background:#f4f7fa;color:#172033;margin:0;padding:40px}main{max-width:760px;margin:auto;background:white;padding:30px;border-radius:16px;border:1px solid #dfe5ec}button{padding:12px 18px;border:0;border-radius:8px;background:#173b5d;color:white;font-weight:700;cursor:pointer}#result{font-size:1.4rem;margin-top:20px}</style></head><body><main><h1>Gravity Lab</h1><p>Drop an object and estimate its speed after a given time using <strong>v = g × t</strong>.</p><label>Time (seconds): <input id="t" type="number" value="2" min="0" step="0.1"></label><button onclick="calc()">Calculate</button><div id="result"></div><p><a href="../../">Back to Learning Center</a></p></main><script>function calc(){const t=Number(document.getElementById('t').value);document.getElementById('result').textContent=`Estimated speed: ${(9.8*t).toFixed(2)} m/s downward.`}</script></body></html>
