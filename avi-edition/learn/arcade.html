<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Avi Physics Arcade — 12 Games</title>
<style>
:root{--bg:#09111f;--panel:#111d31;--panel2:#162640;--ink:#f5f8ff;--muted:#aab7ca;--accent:#62d6ff;--accent2:#9b7cff;--good:#72e0a0;--danger:#ff718b}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 20% 0,#253b69 0,#09111f 48%);color:var(--ink);font-family:system-ui,-apple-system,Segoe UI,Arial,sans-serif;min-height:100vh}header{text-align:center;padding:35px 18px 18px}header h1{font-size:clamp(2.2rem,6vw,4rem);margin:5px 0}header p{max-width:850px;margin:auto;color:var(--muted)}main{max-width:1200px;margin:auto;padding:15px}.bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:12px 0 18px}.tabs{display:flex;gap:8px;flex-wrap:wrap}.tab,.control{border:1px solid #ffffff22;background:var(--panel);color:var(--ink);padding:9px 12px;border-radius:10px;cursor:pointer;font-weight:800}.tab:hover,.tab.on{background:linear-gradient(90deg,#23627c,#4e438f)}.score{margin-left:auto;color:#dce8f7;font-weight:800}.game{background:#0d1829;border:1px solid #ffffff1b;border-radius:20px;padding:14px;box-shadow:0 18px 60px #0007}.game h2{margin:5px 5px 0}.hint{color:var(--muted);margin:3px 5px 10px}.wrap{position:relative}.wrap canvas{display:block;width:100%;height:auto;max-height:65vh;background:#050a13;border-radius:14px;cursor:crosshair}.hud{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:10px;color:#d8e4f4}.controls{display:flex;gap:8px;flex-wrap:wrap}.mission{background:var(--panel);border:1px solid #ffffff14;padding:10px 12px;border-radius:10px}.back{display:block;color:#bcd5ff;text-align:center;margin:25px}.kbd{font-family:ui-monospace,monospace;background:#24334b;padding:2px 6px;border-radius:5px}
</style></head>
<body>
<header><div>🎮 AVI EDITION</div><h1>Physics Arcade</h1><p>12 tiny experiments that are actually games. Break the rules, discover the system, and see what happens.</p></header>
<main>
<div class="bar"><div class="tabs" id="tabs"></div><div class="score" id="score">Score: 0</div></div>
<section class="game"><h2 id="title"></h2><div class="hint" id="hint"></div><div class="wrap"><canvas id="c" width="1100" height="620"></canvas></div><div class="hud"><div class="mission" id="mission"></div><div class="controls"><button class="control" id="reset">↻ Reset</button><button class="control" id="pause">Ⅱ Pause</button></div></div></section>
<a class="back" href="./">← Back to the simulation library</a>
</main>
<script>
const c=document.getElementById('c'),x=c.getContext('2d'),tabs=document.getElementById('tabs'),title=document.getElementById('title'),hint=document.getElementById('hint'),mission=document.getElementById('mission'),scoreEl=document.getElementById('score');
let W=c.width,H=c.height,game=0,score=0,paused=false,t=0,mouse={x:W/2,y:H/2,down:false},keys={};
const names=['Gravity Sling','Orbit Dodger','Swarm Lab','Traffic Flow','Bridge Builder','Magnet Maze','Particle Painter','Rocket Landing','Ecosystem','Chain Reaction','Black Hole','Life Machine'];
names.forEach((n,i)=>{let b=document.createElement('button');b.className='tab';b.textContent=(i+1)+' '+n;b.onclick=()=>start(i);tabs.appendChild(b)});
addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true;if(e.key===' '){paused=!paused;e.preventDefault()}if(e.key==='r')start(game)});addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);
c.addEventListener('mousemove',e=>{let r=c.getBoundingClientRect();mouse.x=(e.clientX-r.left)*W/r.width;mouse.y=(e.clientY-r.top)*H/r.height});c.addEventListener('mousedown',()=>mouse.down=true);addEventListener('mouseup',()=>mouse.down=false);document.getElementById('reset').onclick=()=>start(game);document.getElementById('pause').onclick=()=>paused=!paused;
function rng(a,b){return a+Math.random()*(b-a)}function dist(a,b){return Math.hypot(a.x-b.x,a.y-b.y)}function text(s,a,b,z=18){x.fillStyle='#eaf3ff';x.font=z+'px system-ui';x.fillText(s,a,b)}function circle(o,r,fill){x.beginPath();x.arc(o.x,o.y,r,0,Math.PI*2);if(fill){x.fillStyle=fill;x.fill()}else{x.stroke()}}
let S={};
function start(i){game=i;score=0;paused=false;t=0;S={};document.querySelectorAll('.tab').forEach((b,j)=>b.classList.toggle('on',j===i));title.textContent=names[i];scoreEl.textContent='Score: 0';
const hs=[
'Click and drag from the ball, then release. Launch it through the gates.','Use A/D to steer your ship while gravity bends the path. Survive as long as possible.','Move your mouse. Attract the swarm with left click; repel it with right click.','Cars follow simple rules. Click intersections to change lights and keep traffic moving.','Click to place bridge supports. Connect the green islands before the cargo falls.','WASD moves the ball. Nearby magnets pull it toward their poles. Reach the exit.','Paint particles with the mouse. Try to make a stable vortex without losing too many particles.','Arrow keys steer the rocket. Land softly on the platform.','Click to add food. Keep the little world alive as long as possible.','Click once. Your goal is to start the biggest chain reaction.','Move the mouse to place a black hole. It bends every particle path.','Click cells to toggle them. Press SPACE to run the cellular universe.' ];hint.textContent=hs[i];mission.textContent='Mission: '+['Score 5 gates in one launch.','Survive 20 seconds.','Get 25 particles within 80px of the cursor.','Keep 10 cars moving at once.','Build a bridge with 8 supports or fewer.','Reach the green exit.','Keep 70 particles alive for 20 seconds.','Touch down with low speed.','Reach 30 seconds.','Create 20 explosions.','Absorb 25 particles.','Create a stable pattern.'][i];}
function resetCommon(){x.clearRect(0,0,W,H)}
function draw(){resetCommon();if(game===0)g0();if(game===1)g1();if(game===2)g2();if(game===3)g3();if(game===4)g4();if(game===5)g5();if(game===6)g6();if(game===7)g7();if(game===8)g8();if(game===9)g9();if(game===10)g10();if(game===11)g11();if(!paused)t+=1/60;requestAnimationFrame(draw)}
// 1 Gravity Sling
function g0(){if(!S.ball){S.ball={x:150,y:480,vx:0,vy:0,launched:false};S.gates=[{x:350,y:390},{x:560,y:250},{x:800,y:370},{x:980,y:180}];S.drag=null}let b=S.ball;x.strokeStyle='#243a59';for(let q=0;q<6;q++){x.beginPath();x.moveTo(0,520+q*18);x.lineTo(W,520+q*18);x.stroke()}S.gates.forEach(g=>{x.strokeStyle='#72e0a0';x.lineWidth=7;x.beginPath();x.arc(g.x,g.y,25,0,Math.PI*2);x.stroke();x.lineWidth=1});if(!b.launched&&mouse.down){S.drag={x:mouse.x,y:mouse.y}}if(!b.launched&&S.drag){x.strokeStyle='#62d6ff';x.lineWidth=4;x.beginPath();x.moveTo(b.x,b.y);x.lineTo(mouse.x,mouse.y);x.stroke();x.lineWidth=1}if(!b.launched&&!mouse.down&&S.drag){b.vx=(b.x-mouse.x)*.045;b.vy=(b.y-mouse.y)*.045;b.launched=true;S.drag=null}if(b.launched&&!paused){b.vy+=.28;b.x+=b.vx;b.y+=b.vy;if(b.y>520){b.y=520;b.vy*=-.62;b.vx*=.96}S.gates=S.gates.filter(g=>{if(dist(b,g)<32){score++;scoreEl.textContent='Score: '+score;return false}return true});if(b.x>W+50||b.y>H+50||b.x<-50)S.ball={x:150,y:480,vx:0,vy:0,launched:false}}circle(b,13,'#62d6ff');text('DRAG ← release',30,40,18)}
// 2 Orbit Dodger
function g1(){if(!S.ship){S.ship={x:180,y:300,vx:2,vy:-1};S.planets=[{x:540,y:310,r:55,m:1.5},{x:800,y:180,r:38,m:1},{x:870,y:470,r:45,m:1.3}]}S.planets.forEach(p=>{circle(p,p.r,'#273b63');circle(p,p.r+4,null);});let q=S.ship;for(let p of S.planets){let dx=p.x-q.x,dy=p.y-q.y,d=Math.max(45,Math.hypot(dx,dy)),a=p.m*180/d**2;q.vx+=dx/d*a;q.vy+=dy/d*a}if(keys['a'])q.vx-=.08;if(keys['d'])q.vx+=.08;q.x+=q.vx;q.y+=q.vy;circle(q,9,'#9b7cff');text('A / D = thrust',25,38);if(S.planets.some(p=>dist(q,p)<p.r+9)){score=0;start(1)}else if(q.x<0||q.x>W||q.y<0||q.y>H){score=Math.floor(t*10);S.ship={x:180,y:300,vx:2,vy:-1}}else{score=Math.floor(t*10);scoreEl.textContent='Score: '+score}}
// 3 Swarm Lab
function g2(){if(!S.p){S.p=Array.from({length:90},()=>({x:rng(0,W),y:rng(0,H),vx:rng(-1,1),vy:rng(-1,1)}))}let near=0;S.p.forEach(p=>{let dx=mouse.x-p.x,dy=mouse.y-p.y,d=Math.hypot(dx,dy)||1;if(d<260){let f=(mouse.down?-1:1)*.35/(d/80+1);p.vx+=dx/d*f;p.vy+=dy/d*f;if(d<80)near++}p.vx*=.985;p.vy*=.985;p.x+=p.vx;p.y+=p.vy;if(p.x<0||p.x>W)p.vx*=-1;if(p.y<0||p.y>H)p.vy*=-1;circle(p,4,'#62d6ff')});circle(mouse,12,mouse.down?'#ff718b':'#72e0a0');score=near;scoreEl.textContent='Score: '+score+' nearby'}
// 4 Traffic Flow
function g3(){if(!S.cars){S.cars=Array.from({length:18},(_,i)=>({x:rng(0,W),y:rng(0,H),a:Math.random()<.5?0:Math.PI/2,v:1.4,wait:0}));S.lights=[{x:360,y:310,h:false},{x:740,y:310,h:false}]}x.strokeStyle='#31445d';x.lineWidth=55;x.beginPath();x.moveTo(0,310);x.lineTo(W,310);x.moveTo(550,0);x.lineTo(550,H);x.stroke();x.lineWidth=1;S.lights.forEach(l=>{circle(l,18,l.h?'#ff718b':'#72e0a0')});if(mouse.down&&!S.last){S.lights.forEach(l=>{if(dist(mouse,l)<35)l.h=!l.h});S.last=1}if(!mouse.down)S.last=0;let moving=0;S.cars.forEach(q=>{let stop=S.lights.some(l=>dist(q,l)<70&&!l.h&&((Math.abs(Math.cos(q.a))>.5&&Math.abs(q.y-l.y)<25)||(Math.abs(Math.sin(q.a))>.5&&Math.abs(q.x-l.x)<25)));if(!stop){q.x+=Math.cos(q.a)*q.v;q.y+=Math.sin(q.a)*q.v;moving++}if(q.x<0)q.x=W;if(q.x>W)q.x=0;if(q.y<0)q.y=H;if(q.y>H)q.y=0;x.fillStyle='#f5f8ff';x.fillRect(q.x-6,q.y-4,12,8)});score=moving;scoreEl.textContent='Score: '+score+' moving'}
// 5 Bridge Builder
function g4(){if(!S.b){S.b=[];S.load={x:120,y:150,vx:1,vy:0};S.left={x:90,y:470};S.right={x:1010,y:470}}x.fillStyle='#72e0a0';x.fillRect(40,470,130,130);x.fillRect(930,470,130,130);S.b.forEach((p,i)=>{x.strokeStyle='#9b7cff';x.lineWidth=12;if(i){x.beginPath();x.moveTo(S.b[i-1].x,S.b[i-1].y);x.lineTo(p.x,p.y);x.stroke()}circle(p,8,'#62d6ff')});x.lineWidth=1;if(mouse.down&&!S.last&&mouse.y>350){S.b.push({x:mouse.x,y:mouse.y});S.last=1}if(!mouse.down)S.last=0;S.load.vy+=.35;S.load.x+=S.load.vx;S.load.y+=S.load.vy;let onBridge=S.b.some(p=>Math.abs(S.load.x-p.x)<45&&Math.abs(S.load.y-p.y)<20);if(onBridge&&S.load.y>350){S.load.vy=-3}else if(S.load.y>470){S.load.y=470;S.load.vy=0}circle(S.load,14,'#ffcc66');score=S.b.length;scoreEl.textContent='Supports: '+score;if(S.load.x>930&&S.load.y>400){score=100;scoreEl.textContent='BRIDGE COMPLETE!'}}
// 6 Magnet Maze
function g5(){if(!S.p){S.p={x:100,y:100,vx:0,vy:0};S.m=[{x:300,y:180,s:1},{x:500,y:430,s:-1},{x:760,y:180,s:1},{x:900,y:430,s:-1}];S.goal={x:1020,y:300}}S.m.forEach(m=>{circle(m,22,m.s>0?'#ff718b':'#62d6ff');text(m.s>0?'+':'−',m.x-6,m.y+7,22)});for(let m of S.m){let dx=m.x-S.p.x,dy=m.y-S.p.y,d=Math.max(35,Math.hypot(dx,dy)),f=m.s*650/d**2;S.p.vx+=dx/d*f;S.p.vy+=dy/d*f}let sp=3;if(keys['w'])S.p.vy-=.1;if(keys['s'])S.p.vy+=.1;if(keys['a'])S.p.vx-=.1;if(keys['d'])S.p.vx+=.1;S.p.vx*=.97;S.p.vy*=.97;S.p.x+=S.p.vx*sp;S.p.y+=S.p.vy*sp;S.p.x=Math.max(10,Math.min(W-10,S.p.x));S.p.y=Math.max(10,Math.min(H-10,S.p.y));circle(S.goal,28,'#72e0a0');circle(S.p,12,'#fff');if(dist(S.p,S.goal)<35){score=100;scoreEl.textContent='ESCAPED!'}}
// 7 Particle Painter
function g6(){if(!S.p)S.p=[];if(mouse.down&&S.p.length<180){for(let i=0;i<3;i++)S.p.push({x:mouse.x+rng(-5,5),y:mouse.y+rng(-5,5),vx:rng(-2,2),vy:rng(-2,2)})}S.p.forEach((p,i)=>{let dx=mouse.x-p.x,dy=mouse.y-p.y,d=Math.max(30,Math.hypot(dx,dy));p.vx+=-dy/d*.16;p.vy+=dx/d*.16;p.vx*=.995;p.vy*=.995;p.x+=p.vx;p.y+=p.vy;if(p.x<0||p.x>W||p.y<0||p.y>H)S.p.splice(i,1);else circle(p,3,'#62d6ff')});score=S.p.length;scoreEl.textContent='Particles: '+score}
// 8 Rocket Landing
function g7(){if(!S.r){S.r={x:180,y:120,vx:1.5,vy:0,ang:0,va:0}}let r=S.r;if(keys['arrowleft'])r.vx-=.03;if(keys['arrowright'])r.vx+=.03;if(keys['arrowup'])r.vy-=.08;r.vy+=.035;r.x+=r.vx;r.y+=r.vy;x.save();x.translate(r.x,r.y);x.rotate(r.ang);x.fillStyle='#f5f8ff';x.fillRect(-9,-18,18,36);x.fillStyle='#ffcc66';if(keys['arrowup'])x.fillRect(-5,18,10,14);x.restore();x.fillStyle='#72e0a0';x.fillRect(820,520,160,14);if(r.y>510){if(r.x>820&&r.x<980&&Math.abs(r.vy)<2&&Math.abs(r.vx)<2){score=100;scoreEl.textContent='SOFT LANDING!'}else{start(7)}}}
// 9 Ecosystem
function g8(){if(!S.e){S.e={};S.food=[];S.a=Array.from({length:14},()=>({x:rng(50,W-50),y:rng(50,H-50),vx:rng(-1,1),vy:rng(-1,1)}));S.p=Array.from({length:6},()=>({x:rng(50,W-50),y:rng(50,H-50),vx:rng(-1,1),vy:rng(-1,1)}))}if(mouse.down&&!S.last){S.food.push({x:mouse.x,y:mouse.y});S.last=1}if(!mouse.down)S.last=0;S.food.forEach(f=>circle(f,5,'#72e0a0'));S.a.forEach(a=>{let f=S.food.sort((u,v)=>dist(a,u)-dist(a,v))[0];if(f){a.vx+=(f.x-a.x)*.0007;a.vy+=(f.y-a.y)*.0007;if(dist(a,f)<10){S.food.splice(S.food.indexOf(f),1)}}a.x+=a.vx;a.y+=a.vy;a.vx*=.99;a.vy*=.99;circle(a,6,'#62d6ff')});S.p.forEach(p=>{let a=S.a.sort((u,v)=>dist(p,u)-dist(p,v))[0];if(a){p.vx+=(a.x-p.x)*.0008;p.vy+=(a.y-p.y)*.0008;if(dist(p,a)<9){S.a.splice(S.a.indexOf(a),1)}}p.x+=p.vx;p.y+=p.vy;p.vx*=.99;p.vy*=.99;circle(p,8,'#ff718b')});score=Math.floor(t);scoreEl.textContent='Time: '+score+'s | prey '+S.a.length+' | predators '+S.p.length}
// 10 Chain Reaction
function g9(){if(!S.p)S.p=Array.from({length:35},()=>({x:rng(20,W-20),y:rng(20,H-20),vx:rng(-1,1),vy:rng(-1,1),boom:0}));S.p.forEach(p=>{p.x+=p.vx;p.y+=p.vy;if(p.x<0||p.x>W)p.vx*=-1;if(p.y<0||p.y>H)p.vy*=-1;circle(p,5,p.boom?'#ff718b':'#62d6ff')});if(mouse.down&&!S.started){S.started=1;S.p.forEach(p=>{if(dist(p,mouse)<70)p.boom=30})}let n=0;S.p.forEach(p=>{if(p.boom>0){n++;p.boom--;S.p.forEach(q=>{if(p!==q&&dist(p,q)<55)q.boom=Math.max(q.boom,18)})}});score=n;scoreEl.textContent='Exploding: '+score}
// 11 Black Hole
function g10(){if(!S.p)S.p=Array.from({length:70},()=>({x:rng(0,W),y:rng(0,H),vx:rng(-1.5,1.5),vy:rng(-1.5,1.5)}));S.p.forEach((p,i)=>{let dx=mouse.x-p.x,dy=mouse.y-p.y,d=Math.max(25,Math.hypot(dx,dy));p.vx+=dx/d*900/d**2;p.vy+=dy/d*900/d**2;p.x+=p.vx;p.y+=p.vy;circle(p,4,'#9b7cff');if(d<18)S.p.splice(i,1)});circle(mouse,18,'#050505');x.strokeStyle='#9b7cff';x.lineWidth=3;x.beginPath();x.arc(mouse.x,mouse.y,28+Math.sin(t*4)*4,0,Math.PI*2);x.stroke();x.lineWidth=1;score=70-S.p.length;scoreEl.textContent='Absorbed: '+score}
// 12 Life Machine
function g11(){if(!S.g){S.g=Array.from({length:31},()=>Array(55).fill(0));S.run=false}for(let y=0;y<31;y++)for(let q=0;q<55;q++)if(S.g[y][q]){x.fillStyle='#62d6ff';x.fillRect(q*20+1,y*20+1,18,18)}if(mouse.down&&!S.last){let q=Math.floor(mouse.x/20),y=Math.floor(mouse.y/20);if(q<55&&y<31)S.g[y][q]^=1;S.last=1}if(!mouse.down)S.last=0;if(keys[' '])S.run=true;if(S.run&&Math.floor(t*10)%2===0&&!S.step){let ng=S.g.map(a=>a.slice());for(let y=0;y<31;y++)for(let q=0;q<55;q++){let n=0;for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++)if(dx||dy)n+=S.g[(y+dy+31)%31][(q+dx+55)%55];ng[y][q]=(n===3||n===2&&S.g[y][q])?1:0}S.g=ng;S.step=1}else if(Math.floor(t*10)%2===1)S.step=0;score=S.g.flat().reduce((a,b)=>a+b,0);scoreEl.textContent='Living cells: '+score}
start(0);draw();
</script></body></html>
