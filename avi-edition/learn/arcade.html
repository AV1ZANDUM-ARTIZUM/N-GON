<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Avi Physics Arcade — 12 Games</title><style>:root{--bg:#09111f;--panel:#111d31;--ink:#f5f8ff;--muted:#aab7ca;--a:#62d6ff;--b:#9b7cff;--good:#72e0a0;--bad:#ff718b}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 20% 0,#253b69,#09111f 48%);color:var(--ink);font-family:system-ui,sans-serif;min-height:100vh}header{text-align:center;padding:30px 18px 16px}header h1{font-size:clamp(2.2rem,6vw,4rem);margin:5px 0}header p{color:var(--muted)}main{max-width:1200px;margin:auto;padding:15px}.bar{display:flex;gap:10px;align-items:center;margin:12px 0 18px}.tabs{display:flex;gap:8px;flex-wrap:wrap}.tab,.control{border:1px solid #ffffff22;background:var(--panel);color:var(--ink);padding:9px 12px;border-radius:10px;cursor:pointer;font-weight:800}.tab.on,.tab:hover{background:linear-gradient(90deg,#23627c,#4e438f)}.score{margin-left:auto;font-weight:800}.game{background:#0d1829;border:1px solid #ffffff1b;border-radius:20px;padding:14px}.hint{color:var(--muted);margin:3px 5px 10px}.wrap canvas{display:block;width:100%;height:auto;background:#050a13;border-radius:14px;cursor:crosshair}.hud{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:10px}.mission{background:var(--panel);padding:10px 12px;border-radius:10px}.controls{display:flex;gap:8px;flex-wrap:wrap}.back{display:block;color:#bcd5ff;text-align:center;margin:25px}@media(max-width:700px){.bar{flex-wrap:wrap}.score{width:100%;margin:0}}</style></head><body><header><div>🎮 AVI EDITION</div><h1>Physics Arcade</h1><p>12 physics games with reliable controls, reset/pause support, and fixed game loops.</p></header><main><div class="bar"><div class="tabs" id="tabs"></div><div class="score" id="score">Score: 0</div></div><section class="game"><h2 id="title"></h2><div class="hint" id="hint"></div><div class="wrap"><canvas id="c" width="1100" height="620"></canvas></div><div class="hud"><div class="mission" id="mission"></div><div class="controls"><button class="control" id="reset">↻ Reset</button><button class="control" id="pause">Ⅱ Pause</button></div></div></section><a class="back" href="./">← Back to the simulation library</a></main><script>

c.addEventListener('mousemove',e=>{const r=c.getBoundingClientRect();mouse.x=(e.clientX-r.left)*W/r.width;mouse.y=(e.clientY-r.top)*H/r.height});c.addEventListener('mousedown',e=>{mouse.down=true;mouse.button=e.button});addEventListener('mouseup',()=>mouse.down=false);c.addEventListener('contextmenu',e=>e.preventDefault());document.getElementById('reset').onclick=()=>start(game);document.getElementById('pause').onclick=()=>paused=!paused;
function g0(){if(!S.b){S.b={x:150,y:470,vx:0,vy:0,on:false};S.g=[{x:340,y:390},{x:550,y:250},{x:770,y:370},{x:970,y:180}];S.drag=false}const b=S.b;S.g.forEach(q=>circle(q,25,null,'#72e0a0'));if(!b.on&&mouse.down&&!S.drag&&dst(mouse,b)<35)S.drag=true;if(!b.on&&S.drag){x.strokeStyle='#62d6ff';x.lineWidth=4;x.beginPath();x.moveTo(b.x,b.y);x.lineTo(mouse.x,mouse.y);x.stroke();x.lineWidth=1;if(!mouse.down){b.vx=(b.x-mouse.x)*.045;b.vy=(b.y-mouse.y)*.045;b.on=true;S.drag=false}}if(b.on){b.vy+=.28;b.x+=b.vx;b.y+=b.vy;if(b.y>520){b.y=520;b.vy*=-.62;b.vx*=.96}S.g=S.g.filter(q=>dst(b,q)>=32||(score++,false));if(b.x<-60||b.x>W+60||b.y>H+60)S.b={x:150,y:470,vx:0,vy:0,on:false}}circle(S.b,13,'#62d6ff');txt('Drag the blue ball',25,38)}
function g1(){if(!S.q){S.q={x:150,y:300,vx:2,vy:-1};S.p=[{x:540,y:310,r:55,m:1.5},{x:800,y:180,r:38,m:1},{x:870,y:470,r:45,m:1.3}]}S.p.forEach(p=>circle(p,p.r,'#273b63','#536b91'));let q=S.q;S.p.forEach(p=>{let dx=p.x-q.x,dy=p.y-q.y,dd=Math.max(50,Math.hypot(dx,dy)),a=p.m*160/dd**2;q.vx+=dx/dd*a;q.vy+=dy/dd*a});if(keys.a||keys.arrowleft)q.vx-=.08;if(keys.d||keys.arrowright)q.vx+=.08;q.x+=q.vx;q.y+=q.vy;circle(q,9,'#9b7cff');score=Math.floor(time*10);if(S.p.some(p=>dst(q,p)<p.r+9)){start(1);return}if(q.x<0||q.x>W||q.y<0||q.y>H)S.q={x:150,y:300,vx:2,vy:-1}}
function g2(){if(!S.p)S.p=Array.from({length:90},()=>({x:rnd(0,W),y:rnd(0,H),vx:rnd(-1,1),vy:rnd(-1,1)}));let n=0;S.p.forEach(p=>{let dx=mouse.x-p.x,dy=mouse.y-p.y,dd=Math.hypot(dx,dy)||1;if(dd<260&&mouse.down){let f=(mouse.button===2?-1:1)*.35/(dd/80+1);p.vx+=dx/dd*f;p.vy+=dy/dd*f;if(dd<80)n++}p.vx*=.985;p.vy*=.985;p.x+=p.vx;p.y+=p.vy;if(p.x<0||p.x>W)p.vx*=-1;if(p.y<0||p.y>H)p.vy*=-1;circle(p,4,'#62d6ff')});circle(mouse,12,mouse.down?(mouse.button===2?'#ff718b':'#72e0a0'):null,'#72e0a0');score=n}
function g3(){if(!S.c){S.c=Array.from({length:18},()=>({x:rnd(0,W),y:rnd(0,H),a:Math.random()<.5?0:Math.PI/2,v:1.5}));S.l=[{x:360,y:310,h:false},{x:740,y:310,h:false}];S.click=false}x.strokeStyle='#31445d';x.lineWidth=55;x.beginPath();x.moveTo(0,310);x.lineTo(W,310);x.moveTo(550,0);x.lineTo(550,H);x.stroke();x.lineWidth=1;S.l.forEach(l=>circle(l,18,l.h?'#ff718b':'#72e0a0'));if(mouse.down&&!S.click){S.l.forEach(l=>{if(dst(mouse,l)<35)l.h=!l.h});S.click=true}if(!mouse.down)S.click=false;let n=0;S.c.forEach(q=>{let stop=S.l.some(l=>dst(q,l)<70&&!l.h&&((Math.abs(Math.cos(q.a))>.5&&Math.abs(q.y-l.y)<25)||(Math.abs(Math.sin(q.a))>.5&&Math.abs(q.x-l.x)<25)));if(!stop){q.x+=Math.cos(q.a)*q.v;q.y+=Math.sin(q.a)*q.v;n++}if(q.x<0)q.x=W;if(q.x>W)q.x=0;if(q.y<0)q.y=H;if(q.y>H)q.y=0;x.fillStyle='#f5f8ff';x.fillRect(q.x-6,q.y-4,12,8)});score=n}
function g4(){if(!S.b){S.b=[];S.load={x:120,y:130,vx:1.3,vy:0};S.won=false}x.fillStyle='#72e0a0';x.fillRect(40,470,130,130);x.fillRect(930,470,130,130);if(mouse.down&&!S.click&&mouse.y>350&&mouse.x>150&&mouse.x<950){S.b.push({x:mouse.x,y:mouse.y});S.click=true}if(!mouse.down)S.click=false;S.b.forEach((p,i)=>{if(i){x.strokeStyle='#9b7cff';x.lineWidth=10;x.beginPath();x.moveTo(S.b[i-1].x,S.b[i-1].y);x.lineTo(p.x,p.y);x.stroke()}circle(p,8,'#62d6ff')});if(!S.won){S.load.vy+=.25;S.load.x+=S.load.vx;S.load.y+=S.load.vy;const hit=S.b.some(p=>Math.abs(S.load.x-p.x)<45&&Math.abs(S.load.y-p.y)<22);if(hit&&S.load.y>350)S.load.vy=-3;if(S.load.y>470){S.load.y=470;S.load.vy=0}if(S.load.x>930&&S.load.y>400){S.won=true;score=100}}circle(S.load,14,'#ffcc66');if(!S.won)score=S.b.length}
function g5(){if(!S.p){S.p={x:100,y:100,vx:0,vy:0};S.m=[{x:300,y:180,s:1},{x:500,y:430,s:-1},{x:760,y:180,s:1},{x:900,y:430,s:-1}];S.goal={x:1020,y:300}}S.m.forEach(m=>{circle(m,22,m.s>0?'#ff718b':'#62d6ff');txt(m.s>0?'+':'−',m.x-6,m.y+7,22)});S.m.forEach(m=>{let dx=m.x-S.p.x,dy=m.y-S.p.y,dd=Math.max(35,Math.hypot(dx,dy)),f=m.s*600/dd**2;S.p.vx+=dx/dd*f;S.p.vy+=dy/dd*f});if(keys.w||keys.arrowup)S.p.vy-=.12;if(keys.s||keys.arrowdown)S.p.vy+=.12;if(keys.a||keys.arrowleft)S.p.vx-=.12;if(keys.d||keys.arrowright)S.p.vx+=.12;S.p.vx*=.97;S.p.vy*=.97;S.p.x=Math.max(10,Math.min(W-10,S.p.x+S.p.vx*3));S.p.y=Math.max(10,Math.min(H-10,S.p.y+S.p.vy*3));circle(S.goal,28,'#72e0a0');circle(S.p,12,'#fff');score=dst(S.p,S.goal)<35?100:Math.min(99,Math.floor(dst(S.p,S.goal)/10))}

function g7(){if(!S.r)S.r={x:180,y:120,vx:1.5,vy:0};let r=S.r;if(keys.arrowleft||keys.a)r.vx-=.035;if(keys.arrowright||keys.d)r.vx+=.035;if(keys.arrowup||keys.w)r.vy-=.09;r.vy+=.04;r.x+=r.vx;r.y+=r.vy;x.fillStyle='#f5f8ff';x.fillRect(r.x-9,r.y-18,18,36);if(keys.arrowup||keys.w){x.fillStyle='#ffcc66';x.fillRect(r.x-5,r.y+18,10,14)}x.fillStyle='#72e0a0';x.fillRect(820,520,160,14);if(r.y>510){if(r.x>820&&r.x<980&&Math.abs(r.vy)<2&&Math.abs(r.vx)<2)score=100;else S.r={x:180,y:120,vx:1.5,vy:0}}}
function g8(){if(!S.a){S.a=Array.from({length:14},()=>({x:rnd(50,W-50),y:rnd(50,H-50),vx:rnd(-1,1),vy:rnd(-1,1)}));S.p=Array.from({length:6},()=>({x:rnd(50,W-50),y:rnd(50,H-50),vx:rnd(-1,1),vy:rnd(-1,1)}));S.food=[];S.click=false}if(mouse.down&&!S.click){S.food.push({x:mouse.x,y:mouse.y});S.click=true}if(!mouse.down)S.click=false;S.food.forEach(f=>circle(f,5,'#72e0a0'));for(let i=S.a.length-1;i>=0;i--){let a=S.a[i];if(S.food.length){let f=S.food.reduce((u,v)=>dst(a,u)<dst(a,v)?u:v);a.vx+=(f.x-a.x)*.0008;a.vy+=(f.y-a.y)*.0008;if(dst(a,f)<10)S.food.splice(S.food.indexOf(f),1)}a.x+=a.vx;a.y+=a.vy;a.vx*=.99;a.vy*=.99;circle(a,6,'#62d6ff');if(a.x<0||a.x>W)a.vx*=-1;if(a.y<0||a.y>H)a.vy*=-1}S.p.forEach(p=>{if(S.a.length){let a=S.a.reduce((u,v)=>dst(p,u)<dst(p,v)?u:v);p.vx+=(a.x-p.x)*.0009;p.vy+=(a.y-p.y)*.0009;if(dst(p,a)<10)S.a.splice(S.a.indexOf(a),1)}p.x+=p.vx;p.y+=p.vy;p.vx*=.99;p.vy*=.99;circle(p,8,'#ff718b')});score=Math.floor(time)}
function g9(){if(!S.p)S.p=Array.from({length:35},()=>({x:rnd(20,W-20),y:rnd(20,H-20),vx:rnd(-1,1),vy:rnd(-1,1),boom:0}));if(mouse.down&&!S.started){S.started=true;S.p.forEach(p=>{if(dst(p,mouse)<70)p.boom=30})}S.p.forEach(p=>{p.x+=p.vx;p.y+=p.vy;if(p.x<0||p.x>W)p.vx*=-1;if(p.y<0||p.y>H)p.vy*=-1});S.p.forEach(p=>{if(p.boom>0){p.boom--;S.p.forEach(q=>{if(p!==q&&dst(p,q)<55)q.boom=Math.max(q.boom,18)})}});score=S.p.filter(p=>p.boom>0).length;S.p.forEach(p=>circle(p,5,p.boom?'#ff718b':'#62d6ff'))}
function g10(){if(!S.p)S.p=Array.from({length:70},()=>({x:rnd(0,W),y:rnd(0,H),vx:rnd(-1.5,1.5),vy:rnd(-1.5,1.5)}));for(let i=S.p.length-1;i>=0;i--){let p=S.p[i],dx=mouse.x-p.x,dy=mouse.y-p.y,dd=Math.max(25,Math.hypot(dx,dy));p.vx+=dx/dd*700/dd**2;p.vy+=dy/dd*700/dd**2;p.x+=p.vx;p.y+=p.vy;if(dd<18)S.p.splice(i,1);else circle(p,4,'#9b7cff')}circle(mouse,18,'#050505','#9b7cff');score=70-S.p.length}
function g11(){if(!S.g){S.g=Array.from({length:31},()=>Array(55).fill(0));S.run=false;S.step=-1;S.click=false}for(let y=0;y<31;y++)for(let q=0;q<55;q++)if(S.g[y][q]){x.fillStyle='#62d6ff';x.fillRect(q*20+1,y*20+1,18,18)}if(mouse.down&&!S.click){let q=Math.floor(mouse.x/20),y=Math.floor(mouse.y/20);if(q>=0&&q<55&&y>=0&&y<31)S.g[y][q]^=1;S.click=true}if(!mouse.down)S.click=false;let st=Math.floor(time*8);if(S.run&&st!==S.step){S.step=st;let ng=S.g.map(a=>a.slice());for(let y=0;y<31;y++)for(let q=0;q<55;q++){let n=0;for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++)if(dx||dy)n+=S.g[(y+dy+31)%31][(q+dx+55)%55];ng[y][q]=(n===3||n===2&&S.g[y][q])?1:0}S.g=ng}score=S.g.flat().reduce((a,b)=>a+b,0)}
const games=[g0,g1,g2,g3,g4,g5,g6,g7,g8,g9,g10,g11];function loop(now){const dt=Math.min(.05,(now-last)/1000);last=now;if(!paused){time+=dt;x.clearRect(0,0,W,H);games[game]();scoreEl.textContent='Score: '+score}else{x.fillStyle='rgba(0,0,0,.35)';x.fillRect(0,0,W,H);txt('PAUSED — press Space or Pause to continue',W/2-220,H/2,22)}requestAnimationFrame(loop)}start(0);requestAnimationFrame(loop);
