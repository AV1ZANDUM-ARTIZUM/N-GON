<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Friction Lab</title><style>body{font-family:system-ui;max-width:720px;margin:auto;padding:30px;background:#f4f7fa;color:#172033}.box{background:white;padding:25px;border-radius:15px;border:1px solid #dce4eb}input{padding:10px;width:100%;margin:6px 0 15px;box-sizing:border-box}button{padding:11px 18px;background:#173b5d;color:white;border:0;border-radius:8px;font-weight:bold}.result{margin-top:18px;font-size:1.15rem}</style></head><body><div class="box"><h1>Friction Lab</h1><p>Estimate friction force with Fᶠ = μN.</p><label>Coefficient of friction μ</label><input id="mu" type="number" step="any"><label>Normal force (N)</label><input id="n" type="number" step="any"><button onclick="calc()">Calculate</button><div class="result" id="r"></div></div><script>function calc(){let mu=+document.getElementById('mu').value,n=+document.getElementById('n').value;document.getElementById('r').textContent='Friction force ≈ '+(mu*n).toFixed(2)+' N'}</script></body></html>
