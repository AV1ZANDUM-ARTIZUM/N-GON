<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Energy Lab</title><style>body{font-family:system-ui,sans-serif;background:#f4f7fa;color:#172033;margin:0;padding:40px}main{max-width:760px;margin:auto;background:white;padding:30px;border-radius:16px;border:1px solid #dfe5ec}button{padding:12px 18px;border:0;border-radius:8px;background:#173b5d;color:white;font-weight:700;cursor:pointer}input{margin:8px;padding:8px}#result{font-size:1.4rem;margin-top:20px}</style></head><body><main><h1>Energy Lab</h1><p>Calculate kinetic energy with <strong>KE = ½mv²</strong>.</p><label>Mass (kg)<input id="m" type="number" value="5" min="0"></label><label>Speed (m/s)<input id="v" type="number" value="4" min="0"></label><button onclick="calc()">Calculate energy</button><div id="result"></div><p><a href="../../">Back to Learning Center</a></p></main><script>function calc(){const m=Number(document.getElementById('m').value),v=Number(document.getElementById('v').value);document.getElementById('result').textContent=`Kinetic energy: ${(0.5*m*v*v).toFixed(2)} J.`}</script></body></html>
